; Production settings on top of php.ini-production.
memory_limit = 256M
; A cloud save upload is at most 2 MB (cloud.max_save_mb).
upload_max_filesize = 8M
post_max_size = 8M
expose_php = Off
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
