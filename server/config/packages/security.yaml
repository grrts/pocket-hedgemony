security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        accounts:
            entity: { class: App\Entity\Account, property: email }

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # The game's JSON API: no sessions, as before the website had a sign-in.
        api:
            pattern: ^/api/
            stateless: true
            lazy: true
            provider: accounts
        # The website: players sign in with their game account (email and password)
        # on /community/signin, and stay signed in with a session.
        main:
            lazy: true
            provider: accounts
            form_login:
                login_path: community_signin
                check_path: community_signin
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: community
                target_path_parameter: next
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                remember_me_parameter: remember
                signature_properties: [password]
            logout:
                path: community_signout
                target: community
                enable_csrf: true
                csrf_token_id: logout

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
