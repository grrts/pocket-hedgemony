framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache, and with it the rate limiters and the website's login throttling
        # (cache.rate_limiter), sits in the database's `cache_items` table, so every app server
        # counts the same attempts (docs/deploy.md).
        app: cache.adapter.doctrine_dbal

        # Namespaced pools use the above "app" backend by default
        pools:
            # Apple's and Google's public keys for ID tokens (App\Account\IdToken\KeySets).
            cache.sign_in_keys:
                adapter: cache.app

when@test:
    framework:
        cache:
            # Tests make and drop their tables themselves; the cache stays out of the database.
            app: cache.adapter.filesystem
            pools:
                # Each test starts with no keys fetched (tests make their own keys).
                cache.sign_in_keys:
                    adapter: cache.adapter.array
