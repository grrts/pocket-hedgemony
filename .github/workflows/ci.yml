name: CI

on:
  push:
    branches: [main, claude/project-thread-e8y1yc]
  pull_request:

# A newer push cancels the older run on the same PR or branch: a fix or base
# merge on a PR, or the next merge into main (its run checks both merges).
# Closing or merging a PR cancels its run still going (ci-cancel.yml).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for Ubuntu 26.04 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The wiki's data pages are made from the rules config, and the website's wiki from docs/wiki:
      # make both again and fail if anything changed or a page appeared.
      - name: Wiki matches the config and docs/wiki (run `pnpm wiki` and commit if this fails)
        run: pnpm wiki && git add --intent-to-add docs/wiki server/wiki && git diff --exit-code --stat -- docs/wiki server/wiki
      - run: pnpm test
      - run: pnpm --filter @ph/client build
      - name: Engine worker in a mobile Chromium browser
        run: |
          pnpm --filter @ph/client exec playwright-core install --with-deps chromium
          pnpm --filter @ph/client smoke
      - name: Every panel's close button, tapped on a phone
        run: pnpm --filter @ph/client close-check
      # Timing budgets swing with how busy the runner is, so they run on
      # pushes to main and the build branch, not on every PR push.
      - name: Frame and turn budgets (docs/performance.md)
        if: github.event_name == 'push'
        run: pnpm --filter @ph/client perf
      - name: Engine worker in Electron
        run: xvfb-run -a pnpm --filter @ph/desktop smoke
      - name: Engine turn bench (docs/performance.md)
        if: github.event_name == 'push'
        run: pnpm bench

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The production database, for the migrations check below (docs/deploy.md).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, intl
      - run: composer install --no-interaction --no-progress
      - run: php bin/console lint:container
      - run: php bin/phpunit
      # Production builds its schema from migrations only. Run them all on an empty PostgreSQL and
      # fail if the entities need anything they don't make: after changing an entity, add a
      # migration with `doctrine:migrations:diff` (docs/deploy.md).
      - name: Migrations match the entities (add one with doctrine:migrations:diff if this fails)
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
          php bin/console doctrine:migrations:migrate first --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction

  # The server image for one-VPS deploys (deploy/, docs/deploy.md): build it, start it with its
  # database, and check that the migrations ran, the API answers and the web game is served.
  deploy-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          printf 'DOMAIN=localhost\nSERVER_NAME=:80\nPUBLIC_URL=http://localhost\nPOSTGRES_PASSWORD=ci%s\nAPP_SECRET=%s\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 32)" > deploy/.env
          docker compose -f deploy/compose.yaml up -d --build
      - name: The server, website and game answer
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost/api/health && break; sleep 2; done
          curl -sf http://localhost/api/health | grep -q '"ok"'
          curl -sf -o /dev/null http://localhost/
          curl -sf http://localhost/play/ | grep -q '<script'
          docker compose -f deploy/compose.yaml exec -T app php bin/console doctrine:migrations:up-to-date
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
