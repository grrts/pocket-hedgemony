name: CI

on:
  push:
    branches: [main, claude/project-thread-e8y1yc]
  pull_request:

# A newer push to a PR (a fix, a base merge) cancels its older run, and
# closing or merging the PR cancels the run still going (ci-cancel.yml).
# Pushes to main always run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ph/client build
      - name: Engine worker in a mobile Chromium browser
        run: |
          pnpm --filter @ph/client exec playwright-core install --with-deps chromium
          pnpm --filter @ph/client smoke
      - name: Every panel's close button, tapped on a phone
        run: pnpm --filter @ph/client close-check
      # Timing budgets swing with how busy the runner is, so they run on
      # pushes to main and the build branch, not on every PR push.
      - name: Frame and turn budgets (docs/performance.md)
        if: github.event_name == 'push'
        run: pnpm --filter @ph/client perf
      - name: Engine worker in Electron
        run: xvfb-run -a pnpm --filter @ph/desktop smoke
      - name: Engine turn bench (docs/performance.md)
        if: github.event_name == 'push'
        run: pnpm bench

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, intl
      - run: composer install --no-interaction --no-progress
      - run: php bin/console lint:container
      - run: php bin/phpunit
