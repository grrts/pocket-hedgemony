name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ph/client build
      - name: Engine worker in a mobile Chromium browser
        run: |
          pnpm --filter @ph/client exec playwright-core install --with-deps chromium
          pnpm --filter @ph/client smoke
      - name: Frame and turn budgets (docs/performance.md)
        run: pnpm --filter @ph/client perf
      - name: Engine worker in Electron
        run: xvfb-run -a pnpm --filter @ph/desktop smoke
      - run: pnpm bench

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, intl
      - run: composer install --no-interaction --no-progress
      - run: php bin/console lint:container
      - run: php bin/phpunit
