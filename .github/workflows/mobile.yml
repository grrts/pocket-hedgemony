name: Phone apps

# Builds the Capacitor apps (docs/mobile.md) unsigned, to catch a plugin or
# project change that no longer compiles. Signed builds are made by hand.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/mobile/**
      - apps/client/src/cloud/**
      - .github/workflows/mobile.yml
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ph/mobile sync
      - name: Projects unchanged by sync (commit what `pnpm --filter @ph/mobile sync` changed if this fails)
        run: git diff --exit-code --stat -- apps/mobile
      - name: Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ph/mobile sync
      - name: Simulator build, unsigned
        working-directory: apps/mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
